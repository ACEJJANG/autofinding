name: Auto Scrape Cremation Data

on:
  schedule:
    - cron: '0 * * * *' # 매시간 정각마다 실행 (원하시는 주기로 변경 가능, 예: '*/30 * * * *'는 30분마다)
  workflow_dispatch: # 수동으로 즉시 실행 버튼 클릭 가능

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브 레포지토리에 자동 파일 수정을 허용하기 위한 권한
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update cremation data: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
