<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강릉 솔향하늘길 화장예약 실시간 현황판</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">🔥 강릉 솔향하늘길 화장예약 실시간 현황</h1>
            <p class="text-slate-400 text-sm">앞으로 3일간의 일반시신 관내·관외 회차별 예약 현황</p>
            <div id="update-time" class="mt-3 inline-block bg-slate-800 text-cyan-400 px-4 py-1 rounded-full text-xs font-mono border border-slate-700">
                데이터 동기화 시간 확인 중...
            </div>
        </header>

        <!-- 현황판 카드 컨테이너 -->
        <div id="board-container" class="space-y-6">
            <!-- 자바스크립트로 데이터가 동적으로 렌더링됩니다 -->
            <div class="text-center py-12 text-slate-500">데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        async function fetchReservationData() {
            try {
                // 같은 레포지토리에 있는 data.json을 캐시 없이 가져옴
                const response = await fetch('./data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('데이터를 불러오지 못했습니다.');
                
                const result = await response.json();
                document.getElementById('update-time').innerText = `마지막 갱신: ${result.updated_at}`;
                
                renderBoard(result.data);
            } catch (error) {
                console.error(error);
                document.getElementById('board-container').innerHTML = `
                    <div class="bg-red-900/50 border border-red-700 p-4 rounded-xl text-center text-red-200">
                        데이터 파일을 불러오는 중이거나 아직 첫 수집이 진행되지 않았습니다. 잠시 후 다시 확인해주세요.
                    </div>
                `;
            }
        }

        function renderBoard(dataList) {
            const container = document.getElementById('board-container');
            container.innerHTML = '';

            dataList.forEach(day => {
                let cardHTML = `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
                        <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                            <h2 class="text-xl font-semibold text-cyan-300">📅 ${day.date}</h2>
                            <span class="text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-lg">${day.facility}</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                `;

                day.shifts.forEach(shift => {
                    const inStatus = shift.in_jurisdiction.status;
                    const outStatus = shift.out_jurisdiction.status;
                    
                    const inBadge = inStatus === '예약가능' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border-rose-500/30';
                    const outBadge = outStatus === '예약가능' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border-rose-500/30';

                    cardHTML += `
                        <div class="bg-slate-900/70 border border-slate-700/60 rounded-xl p-4 flex flex-col justify-between">
                            <div class="font-bold text-lg text-slate-200 mb-3 border-b border-slate-800 pb-2">${shift.turn}</div>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">관내</span>
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${inBadge}">${inStatus}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">관외</span>
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${outBadge}">${outStatus}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                cardHTML += `</div></div>`;
                container.innerHTML += cardHTML;
            });
        }

        // 페이지 접속 시 로드 및 1분마다 자동 새로고침
        fetchReservationData();
        setInterval(fetchReservationData, 60000);
    </script>
</body>
</html>
